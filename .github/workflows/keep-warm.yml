name: Keep-warm ping

# Pings the BankNest API every 10 minutes so the free-tier Render
# service stays warm and users never hit a 60s cold start.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl -fsS --max-time 30 https://banknest-api.onrender.com/api/health
