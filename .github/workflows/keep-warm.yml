name: Keep-warm ping

# Pings the BankNest API every 10 minutes so the free-tier Render
# service stays warm and users never hit a 60s cold start.
# Best-effort by design: a ping that times out during a redeploy
# must not mark the repository red.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        continue-on-error: true
        run: curl -fsS --max-time 90 https://banknest-api.onrender.com/api/health
