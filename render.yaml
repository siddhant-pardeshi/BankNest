# Render Blueprint — provisions the BankNest API service.
# The frontend is deployed separately as a static site (see README).
#
# Secrets marked `sync: false` are prompted for (or set in the dashboard)
# when the blueprint is applied — never committed to git.

services:
  - type: web
    name: banknest-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DDL_AUTO
        value: "update"
