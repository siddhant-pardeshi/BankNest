spring.application.name=BankNest
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# Database — values are supplied by environment variables.
# Defaults target a local MySQL instance for development.
# For deployment provide DB_URL / DB_USERNAME / DB_PASSWORD, e.g.
#   Postgres: jdbc:postgresql://host:5432/dbname?sslmode=require
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banknest_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------
# Security
# JWT_SECRET must be a long random string (>= 32 chars) in production
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:banknest-local-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Graceful shutdown for container orchestrators
server.shutdown=graceful
