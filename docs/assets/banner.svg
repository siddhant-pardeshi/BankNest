<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BankNest — Digital Banking Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12303c"/>
      <stop offset="0.45" stop-color="#26536a"/>
      <stop offset="1" stop-color="#0b1e27"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c877"/>
      <stop offset="1" stop-color="#c99b3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fc4e8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7fc4e8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse {
        animation: pulse 2.6s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pulse {
        0% { transform: scale(0.82); opacity: 0.7; }
        100% { transform: scale(1.38); opacity: 0; }
      }
      .flow {
        stroke-dasharray: 300 1700;
        animation: sweep 5s linear infinite;
      }
      @keyframes sweep {
        from { stroke-dashoffset: 2000; }
        to { stroke-dashoffset: 0; }
      }
      .fall {
        animation: fall 7s linear infinite;
      }
      @keyframes fall {
        0% { transform: translateY(-50px); opacity: 0; }
        12% { opacity: 0.7; }
        85% { opacity: 0.7; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      .cell {
        animation: drift 9s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(26px, -20px) scale(1.15); }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- floating soft cells -->
  <g fill="#7fc4e8" opacity="0.13">
    <circle class="cell" cx="960" cy="60" r="24"/>
    <circle class="cell" cx="1080" cy="200" r="30" style="animation-delay:-3s"/>
    <circle class="cell" cx="880" cy="240" r="18" style="animation-delay:-5s"/>
    <circle class="cell" cx="70" cy="250" r="22" style="animation-delay:-2s"/>
    <circle class="cell" cx="320" cy="40" r="16" style="animation-delay:-6s"/>
  </g>
  <g fill="#ffffff" opacity="0.05">
    <circle class="cell" cx="1010" cy="120" r="40" style="animation-delay:-4s"/>
    <circle class="cell" cx="160" cy="120" r="34" style="animation-delay:-1s"/>
  </g>

  <!-- falling coins -->
  <g class="fall" transform="translate(250,0)">
    <circle cx="0" cy="0" r="10" fill="url(#coinGrad)"/>
    <text x="0" y="4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#5c4413" text-anchor="middle">&#8377;</text>
  </g>
  <g class="fall" transform="translate(440,0)" style="animation-delay:-2.8s">
    <circle cx="0" cy="0" r="8" fill="url(#coinGrad)"/>
    <text x="0" y="3.5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#5c4413" text-anchor="middle">&#8377;</text>
  </g>
  <g class="fall" transform="translate(780,0)" style="animation-delay:-4.4s">
    <circle cx="0" cy="0" r="10" fill="url(#coinGrad)"/>
    <text x="0" y="4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#5c4413" text-anchor="middle">&#8377;</text>
  </g>
  <g class="fall" transform="translate(1115,0)" style="animation-delay:-1.4s">
    <circle cx="0" cy="0" r="8" fill="url(#coinGrad)"/>
    <text x="0" y="3.5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#5c4413" text-anchor="middle">&#8377;</text>
  </g>
  <g class="fall" transform="translate(955,0)" style="animation-delay:-5.6s">
    <circle cx="0" cy="0" r="8" fill="url(#coinGrad)"/>
    <text x="0" y="3.5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#5c4413" text-anchor="middle">&#8377;</text>
  </g>

  <!-- ledger / trend line with travelling glow -->
  <path
    d="M0,200 L80,200 L100,178 L130,214 L160,192 L240,192 L260,170 L290,206 L320,186 L400,186 L420,164 L450,200 L480,180 L560,180 L580,158 L610,194 L640,174 L720,174 L740,152 L770,188 L800,168 L880,168 L900,146 L930,182 L960,162 L1040,162 L1060,140 L1090,176 L1120,156 L1200,132"
    fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path
    class="flow"
    d="M0,200 L80,200 L100,178 L130,214 L160,192 L240,192 L260,170 L290,206 L320,186 L400,186 L420,164 L450,200 L480,180 L560,180 L580,158 L610,194 L640,174 L720,174 L740,152 L770,188 L800,168 L880,168 L900,146 L930,182 L960,162 L1040,162 L1060,140 L1090,176 L1120,156 L1200,132"
    fill="none" stroke="#9fd8f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px rgba(159,216,242,0.9))"/>

  <!-- rupee emblem with pulse rings -->
  <circle cx="185" cy="150" r="105" fill="url(#glow)"/>
  <circle class="pulse" cx="185" cy="150" r="58" fill="none" stroke="#9fd8f2" stroke-width="2"/>
  <circle class="pulse" cx="185" cy="150" r="58" fill="none" stroke="#9fd8f2" stroke-width="2" style="animation-delay:-1.3s"/>
  <circle cx="185" cy="150" r="52" fill="url(#coinGrad)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="185" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#5c4413" text-anchor="middle">&#8377;</text>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#ffffff">BankNest</text>
  <text x="334" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#bcd9e8">Digital Banking Platform — secure accounts, safe transfers, live ledger</text>
  <text x="334" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#ffffff" fill-opacity="0.72">React  •  Spring Boot  •  JWT + BCrypt  •  MySQL  •  Row-locked atomic transfers  •  CI on every push</text>
</svg>
